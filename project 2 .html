<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Avatar Page</title>

    <style>
        body {
            background-image: url('anime.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-color: #d3a2a2;
            background-blend-mode: multiply;
            font-family: 'Ubuntu', sans-serif;
        }

        body:hover {
            background-blend-mode: normal;
        }

        .container {
            color: white;
            font-style: italic;
        }

        h5 {
            font-size: large;
            margin-left: 20px;
        }

        h1 {
            font-size: 70px;
            margin-left: 40px;
            margin-top: 200px;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin: 20px 40px 0 0;
        }

        a {
            color: white;
            text-decoration: none;
            font-size: 25px;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Button Animation */
        @keyframes buttonAnimation {
            from {
                background-color: #d3a2a2;
            }
            to {
                background-color: blanchedalmond;
            }
        }

        .btn {
            margin-left: 40px;
            margin-top: 20px;

            padding: 10px 20px;
            font-size: 30px;
            font-family: 'Times New Roman', Times, serif;

            color: black;
            background-color: white;
            border: none;
            border-radius: 15px;

            cursor: pointer;
            animation: buttonAnimation 2s infinite alternate;
        }

        .btn:hover {
            background-color: antiquewhite;
        }
    </style>
</head>

<body>
    <div class="container">
        <h5>AVATAR</h5>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Photos</a>
            <a href="#">Views</a>
            <a href="#">About</a>
        </nav>

        <h1>AVATAR</h1>

        <input type="button" value="Click Here" class="btn">
    </div>
</body>
</html>
