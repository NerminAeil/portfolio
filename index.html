<!DOCTYPE html>
<HTML>
<HEAD>
<style>
#d1{
   border:2px solid black;
   background-image:url("image1.jpg");
   background-size:cover;
   position:relative;
   width:300px;
   height:200px;
   }
#footer1 {  
    position: fixed; 
    margin-left:50%;	
    bottom: 0;  
    z-index: 100;  
}

</style>

<script>
function f()
{
var x = event.clientX;     // Get the horizontal coordinate
var y = event.clientY;     // Get the vertical coordinate
d1.style.left=x+"px";
d1.style.top=y+"px";
footer1.innerHTML="("+x+","+y+")";
}
function f1()
{
var x = event.clientX;     // Get the horizontal coordinate
var y = event.clientY;     // Get the vertical coordinate
if(y<500){
   d1.style.left=(x-100)+"px";
   d1.style.top=(y-100)+"px";
   footer1.innerHTML="("+x+","+y+")";
   }
}
</script>
</HEAD>
<BODY onclick="f();">
<div id=d1 onmousemove="f1();"></div><br/>
<span id=footer1>
(0,0)
</span>
